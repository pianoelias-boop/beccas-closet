name: Probe Shopify from GitHub (diagnostic)

# Run by hand. Pages through real store catalogues the way the sale check does, at a steady pace, and records when
# Shopify starts answering 429, whether a refused machine is refused for everything or only for big catalogue
# pages, and whether smaller pages fare better. Changes nothing in the repository.
on:
  workflow_dispatch:
    inputs:
      gap:
        description: "seconds between requests"
        default: "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe
        env: { GAP: '${{ github.event.inputs.gap }}' }
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, time, os, json
          GAP = float(os.environ.get('GAP') or 3); ctx = ssl.create_default_context(); T0 = time.time()
          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          def hit(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,*/*'}), timeout=40, context=ctx)
                  b = r.read(); return r.status, len(b)
              except urllib.error.HTTPError as e: return e.code, 0
              except Exception as e: return type(e).__name__, 0
          def log(tag, url, res): print(f'{time.time()-T0:6.0f}s {tag:8} {res[0]} {res[1]:>8}B  {url}', flush=True)
          STORES = ['us.boden.com', 'us.toa.st', 'na.icebreaker.com', 'www.filson.com', 'bigbudpress.com', 'www.studionicholson.com']
          def run(tag, make, limit=40):
              n = refused = 0; first = None
              for s in STORES:
                  for page in range(1, 6):
                      url = make(s, page); res = hit(url); n += 1; log(tag, url, res)
                      if res[0] == 429: refused += 1; first = first or n
                      else: refused = 0
                      time.sleep(GAP)
                      if refused >= 5 or n >= limit or (res[0] == 200 and res[1] < 3000) or res[0] == 404: break
                  if refused >= 5 or n >= limit: break
              print(f'{tag}: {n} requests, first 429 at request {first}')
          print(f'== D: catalogue pages WITH currency=USD, one every {GAP}s')
          run('D', lambda s, p: f'https://{s}/products.json?limit=250&page={p}&currency=USD')
          print('== pause 2 minutes'); time.sleep(120)
          print(f'== E: sale-collection pages (no currency), one every {GAP}s')
          run('E', lambda s, p: f'https://{s}/collections/sale/products.json?limit=250&page={p}')
          print('== pause 2 minutes'); time.sleep(120)
          print(f'== F: plain catalogue pages again (control)')
          run('F', lambda s, p: f'https://{s}/products.json?limit=250&page={p}', limit=15)
          PY
