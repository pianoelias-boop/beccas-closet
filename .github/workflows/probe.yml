name: Probe Shopify from GitHub (diagnostic)

# Run by hand. Pages through real store catalogues the way the sale check does, at a steady pace, and records when
# Shopify starts answering 429, whether a refused machine is refused for everything or only for big catalogue
# pages, and whether smaller pages fare better. Changes nothing in the repository.
on:
  workflow_dispatch:
    inputs:
      gap:
        description: "seconds between requests"
        default: "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe
        env: { GAP: '${{ github.event.inputs.gap }}' }
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, time, os, json
          GAP = float(os.environ.get('GAP') or 3); ctx = ssl.create_default_context(); T0 = time.time()
          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          def hit(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,*/*'}), timeout=40, context=ctx)
                  b = r.read(); return r.status, len(b)
              except urllib.error.HTTPError as e: return e.code, 0
              except Exception as e: return type(e).__name__, 0
          def log(tag, url, res): print(f'{time.time()-T0:6.0f}s {tag:8} {res[0]} {res[1]:>8}B  {url}', flush=True)
          STORES = ['us.boden.com', 'us.toa.st', 'na.icebreaker.com', 'www.filson.com', 'sondeflor.com', 'bigbudpress.com', 'www.studionicholson.com', 'www.margarethowell.co.uk']
          print(f'== A: catalogue pages of 250, one every {GAP}s, until 6 refusals in a row or 90 requests')
          n = refused = 0; first429 = None
          for s in STORES:
              for page in range(1, 13):
                  url = f'https://{s}/products.json?limit=250&page={page}'; res = hit(url); n += 1; log('A', url, res)
                  if res[0] == 429:
                      refused += 1; first429 = first429 or (n, round(time.time()-T0))
                  else: refused = 0
                  time.sleep(GAP)
                  if refused >= 6 or n >= 90 or (res[0] == 200 and res[1] < 3000): break
              if refused >= 6 or n >= 90: break
          print('first 429 at request/second:', first429)
          print('== B: right after, is everything refused or only big pages?')
          for url in ['https://bigbudpress.com/products.json?limit=1', 'https://bigbudpress.com/', 'https://bigbudpress.com/products/carpenter-jeans-black.js', 'https://us.toa.st/products.json?limit=50']:
              log('B', url, hit(url)); time.sleep(GAP)
          print('== C: waiting 3 minutes, then pages of 50')
          time.sleep(180)
          for s in STORES[:4]:
              for page in range(1, 4):
                  url = f'https://{s}/products.json?limit=50&page={page}'; log('C', url, hit(url)); time.sleep(GAP)
          PY
