name: Probe Shopify from GitHub (diagnostic)

# Run by hand. Same machine, same store pages, two Python builds: the operating system's own python3 and the one
# actions/setup-python installs (which the real jobs use). Prints each status and the TLS library each build uses.
# Changes nothing in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: System Python
        run: |
          cat > /tmp/p.py <<'PY'
          import urllib.request, urllib.error, ssl, sys, time
          print(sys.executable, sys.version.split()[0], ssl.OPENSSL_VERSION, flush=True)
          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE   # as build/shopify.py does
          for url in ['https://us.boden.com/products.json?limit=250&page=1&currency=USD', 'https://us.toa.st/products.json?limit=250&page=1&currency=USD', 'https://bigbudpress.com/products.json?limit=250&page=1&currency=USD', 'https://www.filson.com/products.json?limit=250&page=1&currency=USD', 'https://us.boden.com/']:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,text/html,*/*;q=0.8', 'Accept-Language': 'en-US,en;q=0.9'}), timeout=40, context=ctx); r.read(); res = r.status
              except urllib.error.HTTPError as e: res = f'{e.code} retry-after={e.headers.get("retry-after")}'
              except Exception as e: res = type(e).__name__
              print(f'  {res}  {url}', flush=True); time.sleep(3)
          PY
          /usr/bin/python3 /tmp/p.py
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: setup-python's Python (what the real jobs use)
        run: python3 /tmp/p.py
      - name: System Python again (control, after the other)
        run: /usr/bin/python3 /tmp/p.py
