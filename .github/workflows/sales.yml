name: Daily sale check

on:
  schedule:
    - cron: '41 8 * * *'    # 04:41 US Eastern (daylight); off the hour because GitHub fires top-of-hour crons late
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: sales

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check the brands
        run: python3 build/sales/check.py
      - name: Watch the return-policy pages
        run: python3 build/returns/check.py || echo "policy check failed, continuing"
      - name: Raise an issue if a store changed its return terms
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          changed=$(python3 -c "import json;print(', '.join(json.load(open('build/returns/changes.json'))['changed']))")
          if [ -n "$changed" ]; then
            title="Return policy pages changed: $changed"
            if [ "$(gh issue list --state open --search "in:title \"Return policy pages changed\"" --json number --jq 'length')" = "0" ]; then
              gh issue create --title "$title" --assignee pianoelias-boop --body "@pianoelias-boop — the return-terms sentences on these stores' policy pages changed since the last check: $changed. Re-read the pages, update build/returns/retailers.json (and its checked date), run python3 build/returns/make.py, and commit retailers.js. Closing this issue does not update anything by itself."
            fi
          fi
      - name: Publish if anything changed
        run: |
          git config user.name "closet-bot"; git config user.email "closet-bot@users.noreply.github.com"
          git add sales.js build/sales/history.json build/returns/hashes.json build/returns/changes.json
          git commit -m "Sale check $(date -u +%F)" || echo "no change"
          git push
